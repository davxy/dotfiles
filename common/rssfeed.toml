# Copy this file to ~/.config/rssfeed/config.toml, or let `rssfeed import` make it.
# A path that starts with ~ starts at the home directory.
# Other relative paths are relative to this file.
#
# The feeds are at the end of the file, one block for each feed. `rssfeed import` adds the
# feeds of an OPML file. The fields of a feed:
#
#   [[feed]]
#   name = "LWN.net"
#   url = "https://lwn.net/headlines/rss"
#   # The web site. `rssfeed import` uses it to find the same feed with a different URL.
#   site = "https://lwn.net"
#   tags = ["linux"]
#   # "auto" (default): download the article page if the item text is short.
#   # "always": download the article page for each item. "never": use only the feed text.
#   full_text = "auto"

# Items go to <data_dir>/items/<YYYY-MM-DD>/<feed>--<title>-<hash>.md. The day is the day
# when rssfeed found the item.
data_dir = "~/.local/share/rssfeed"

# The state of the feeds and the items that rssfeed already found.
state_dir = "~/.local/state/rssfeed"

# Some sites refuse requests with an unknown or empty User-Agent.
user_agent = "rssfeed/0.1"

# The first fetch of a feed writes only the items of the last N days. It records the older
# items, and the items with no date, as found. Without this, a new feed gives all its old items.
first_fetch_days = 30

# For full_text = "auto": download the article page when the text of the item is shorter.
full_text_min_chars = 500

# Cut a longer text of an item at this number of characters.
max_chars = 50000

